services:
  website:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vrika-website
    ports:
      - "3002:3000"
    environment:
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
    restart: unless-stopped

networks:
  default:
    name: vrika-website-network
